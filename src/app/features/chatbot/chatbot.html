<div class="chatbot">
  <button class="chatbot__fab" (click)="toggleOpen()" aria-label="Toggle chat assistant">💬</button>

  @if (isOpen()) {
    <div class="chatbot__panel">
      <div class="chatbot__header">
        <span>Ask me anything</span>
        <button type="button" class="chatbot__close" (click)="toggleOpen()" aria-label="Close chat">✕</button>
      </div>

      <div class="chatbot__messages">
        @for (m of messages(); track m.id) {
          <div
            class="chatbot__message"
            [class.chatbot__message--user]="m.role === 'user'"
            [class.chatbot__message--bot]="m.role === 'bot'"
          >{{ m.text }}</div>
        }
        <div #scrollAnchor></div>
      </div>

      <form class="chatbot__input-row" (submit)="$event.preventDefault(); send()">
        <input
          type="text"
          class="chatbot__input"
          name="draft"
          placeholder="Ask about my experience..."
          [(ngModel)]="draft"
        />
        <button type="submit" class="chatbot__send">Send</button>
      </form>
    </div>
  }
</div>
