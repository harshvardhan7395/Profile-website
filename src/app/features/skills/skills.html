<section id="skills" class="section section--alt">
  <div class="container">
    <h2 class="section__heading">Skills</h2>
    <div class="skills">
      @for (group of skillGroups; track $index) {
        <div class="skills__group">
          <h3 class="skills__label">{{ group.label }}</h3>
          <div class="chips">
            @for (skill of group.skills; track skill) {
              <span class="skills__item chip" [class.chip--accent]="group.accent">
                @if (logoSrc(skill); as src) {
                  <img class="skills__logo" [src]="src" alt="" />
                }
                {{ skill }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
